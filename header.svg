<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 200" role="img" aria-label="Several stylized target curves with axes and legend">
  <title>signature target curves</title>

  <g fill="#8a8074" font-family="ui-monospace, 'SF Mono', monospace" font-size="11" text-anchor="end">
    <text x="36" y="32">+6</text>
    <text x="36" y="76">0</text>
    <text x="36" y="120">-6</text>
  </g>

  <g transform="translate(40, 0)">
    <g stroke="#a0958a" stroke-width="1" opacity="0.32">
      <line x1="20" y1="28" x2="780" y2="28"/>
      <line x1="20" y1="116" x2="780" y2="116"/>
    </g>

    <line x1="20" y1="72" x2="780" y2="72" stroke="#a0958a" stroke-width="1" stroke-dasharray="4 5" opacity="0.6"/>

    <g stroke="#a0958a" stroke-width="1" opacity="0.38">
      <line x1="237" y1="20" x2="237" y2="128"/>
      <line x1="430" y1="20" x2="430" y2="128"/>
      <line x1="623" y1="20" x2="623" y2="128"/>
    </g>

    <path d="M 20,24 C 110,24 180,24 220,36 C 270,50 320,64 380,72 C 490,80 580,86 780,96"
          fill="none" stroke="#8d6e63" stroke-width="2.4" opacity="0.6"
          stroke-linecap="round" stroke-linejoin="round"
          pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
      <animate attributeName="stroke-dashoffset" from="1" to="0" dur="1.7s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.42 0 0.58 1"/>
    </path>
    <path d="M 20,28 C 130,28 200,28 240,36 C 290,46 320,62 380,72 C 460,80 540,80 780,86"
          fill="none" stroke="#4a8fbf" stroke-width="2.4" opacity="0.7"
          stroke-linecap="round" stroke-linejoin="round"
          pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
      <animate attributeName="stroke-dashoffset" from="1" to="0" dur="1.7s" begin="0.5s" fill="freeze" calcMode="spline" keySplines="0.42 0 0.58 1"/>
    </path>
    <path d="M 20,54 C 200,56 400,62 600,68 L 780,76"
          fill="none" stroke="#7b9e89" stroke-width="2.4" opacity="0.7"
          stroke-linecap="round" stroke-linejoin="round"
          pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
      <animate attributeName="stroke-dashoffset" from="1" to="0" dur="1.7s" begin="0.7s" fill="freeze" calcMode="spline" keySplines="0.42 0 0.58 1"/>
    </path>
    <path d="M 20,32 C 140,32 200,32 240,39 C 285,48 310,64 360,70 C 430,78 520,72 780,80"
          fill="none" stroke="#d97757" stroke-width="3.2"
          stroke-linecap="round" stroke-linejoin="round"
          pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
      <animate attributeName="stroke-dashoffset" from="1" to="0" dur="1.7s" begin="0.9s" fill="freeze" calcMode="spline" keySplines="0.42 0 0.58 1"/>
    </path>
  </g>

  <g fill="#8a8074" font-family="ui-monospace, 'SF Mono', monospace" font-size="11" text-anchor="middle">
    <text x="60" y="148">20</text>
    <text x="277" y="148">100</text>
    <text x="470" y="148">1k</text>
    <text x="663" y="148">10k</text>
    <text x="800" y="148">20k Hz</text>
  </g>

  <g font-family="ui-monospace, 'SF Mono', monospace" font-size="11">
    <g transform="translate(60, 178)">
      <line x1="0" y1="0" x2="20" y2="0" stroke="#d97757" stroke-width="3" stroke-linecap="round"/>
      <text x="26" y="4" fill="#555" font-weight="bold">Harman</text>
    </g>
    <g transform="translate(170, 178)">
      <line x1="0" y1="0" x2="20" y2="0" stroke="#4a8fbf" stroke-width="2.4" stroke-linecap="round"/>
      <text x="26" y="4" fill="#666">Olive-Welti</text>
    </g>
    <g transform="translate(310, 178)">
      <line x1="0" y1="0" x2="20" y2="0" stroke="#8d6e63" stroke-width="2.4" stroke-linecap="round"/>
      <text x="26" y="4" fill="#666">B&amp;K</text>
    </g>
    <g transform="translate(400, 178)">
      <line x1="0" y1="0" x2="20" y2="0" stroke="#7b9e89" stroke-width="2.4" stroke-linecap="round"/>
      <text x="26" y="4" fill="#666">Toole</text>
    </g>
